{{define "template"}}
<h1>{{.Title}}</h1>
<form action="{{.Action}}" method="POST">
	<input type="date" name="purchaseDate" value="{{.Bottle.PurchaseDate}}" required>
	<input type="number" step="0.01" name="purchasePrice" placeholder='{{T "purchasePrice"}}' {{if ne .Bottle.PurchasePrice 0.0}}value="{{.Bottle.PurchasePrice}}"{{end}} required>
	<input type="number" step="0.1" name="initialWeight" placeholder='{{T "initialWeight"}}' {{if ne .Bottle.InitialWeight 0.0}}value="{{.Bottle.InitialWeight}}"{{end}} required>
	<input type="number" step="0.1" name="fillingWeight" placeholder='{{T "fillingWeight"}}' {{if ne .Bottle.FillingWeight 0.0}}value="{{.Bottle.FillingWeight}}"{{end}} required>
	<input type="submit" value='{{.SubmitLabel}}'>
</form>
{{end}}
