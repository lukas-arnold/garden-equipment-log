{{define "template"}}
<h1 class="center">{{T "addOperation"}}</h1>
<form action="/bottle-operation/add/{{.BottleId}}" method="POST">
	<label for="date">{{T "date"}}</label>
	<input type="date" id="date" name="date" required>
	<label for="weight">{{T "weight"}}</label>
	<input type="number" step="0.1" id="weight" name="weight" placeholder='{{T "weight"}}' required>
	<input type="submit" value='{{T "save"}}' style="width: 100%;" />
</form>
{{end}}
