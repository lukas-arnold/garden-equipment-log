<!DOCTYPE html>
<html lang='{{T "language"}}'>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{T "bottle"}} {{T "weightHistory"}}</title>
  <link rel="icon" type="image/x-icon" href="/web/assets/favicon.ico">
  <link rel="manifest" href="/web/manifest.json">
  <link rel="stylesheet" href="/web/css/pico.min.css">
  <link rel="stylesheet" href="/web/css/center.css">
  <link rel="stylesheet" href="/web/assets/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="/web/assets/fontawesome/css/solid.min.css">
  <script src="/web/js/format.js" defer></script>
</head>

<body>
<header class="container">
  <nav>
    <ul>
      <li><strong>Garden Equipment Log</strong></li>
    </ul>
    <ul>
      <li><a href="/devices">{{T "devices"}}</a></li>
      <li><a href="/bottles">{{T "bottles"}}</a></li>
    </ul>
  </nav>
</header>

<main class="container">
  <h1 class="center">{{T "editOperation"}}</h1>

  <form action="/bottle-operation/save/{{.Operation.Id}}" method="POST">
    <label for="date">{{T "date"}}</label>
    <input type="date" id="date" name="date" value="{{.Operation.Date}}" required>

    <label for="weight">{{T "weight"}}</label>
    <input type="number" step="0.1" id="weight" name="weight" value="{{printf "%.2f" .Operation.Weight}}" required>

    <input type="submit" value='{{T "save"}}' />
  </form>
</main>
</body>
</html>
