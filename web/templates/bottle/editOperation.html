{{define "template"}}
<h1 class="center">{{T "editOperation"}}</h1>
<form action="/bottle-operation/save/{{.Operation.Id}}" method="POST">
	<label for="date">{{T "date"}}</label>
	<input type="date" id="date" name="date" value="{{.Operation.Date}}" required>
	<label for="weight">{{T "weight"}}</label>
	<input type="number" step="0.1" id="weight" name="weight" value="{{printf "%.2f" .Operation.Weight}}" required>
	<input type="submit" value='{{T "save"}}' />
</form>
{{end}}
