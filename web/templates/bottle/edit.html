{{define "template"}}
<h1 class="center">{{T "editBottle"}}</h1>
<form action="/bottle/save/{{.Id}}" method="POST">
	<input type="date" name="purchaseDate" value="{{.PurchaseDate}}" required>
	<input type="number" step="0.01" name="purchasePrice" value="{{.PurchasePrice}}" placeholder='{{T "purchasePrice"}}' required>
	<input type="number" step="0.1" name="initialWeight" value="{{.InitialWeight}}" placeholder='{{T "initialWeight"}}' required>
	<input type="number" step="0.1" name="fillingWeight" value="{{.FillingWeight}}" placeholder='{{T "fillingWeight"}}' required>
	<input type="submit" value='{{T "save"}}'>
</form>
{{end}}
