{{define "template"}}
<h1 class="center">{{.Title}}</h1>
<form action="{{.Action}}" method="POST">
	<input type="text" name="name" placeholder='{{T "name"}}' value="{{.Device.Name}}" required>
	<input type="date" name="purchaseDate" value="{{.Device.PurchaseDate}}" required>
	<input type="number" step="0.01" name="purchasePrice" placeholder='{{T "purchasePrice"}}' {{if ne .Device.PurchasePrice 0.0}}value="{{.Device.PurchasePrice}}"{{end}} required>
	<input type="submit" value='{{.SubmitLabel}}'>
</form>
{{end}}
