<!DOCTYPE html>
<html lang='{{T "language"}}'>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{{T "title"}}</title>
		<link rel="stylesheet" href="/web/css/pico.min.css">
		<script src="/web/js/today.js" defer></script>
	</head>
	<body>
		<header class="container">
			<nav>
				<ul>
					<li><strong>{{T "title"}}<strong></li>
				</ul>
				<ul>
					<li><a href="/devices">{{T "devices"}}</a></li>
					<li><a href="/bottles">{{T "bottles"}}</a></li>
				</ul>
			</nav>
		</header>
		<main class="container">
			<h1>{{.Title}}</h1>
			<form action="{{.Action}}" method="POST">
				<input type="text" name="name" placeholder='{{T "name"}}' value="{{.Device.Name}}" required>
				<input type="date" name="purchaseDate" value="{{.Device.PurchaseDate}}" required>
				<input type="number" step="0.01" name="purchasePrice" placeholder='{{T "purchasePrice"}}' {{if ne .Device.PurchasePrice 0.0}}value="{{.Device.PurchasePrice}}"{{end}} required>
				<input type="submit" value='{{.SubmitLabel}}'>
			</form>
		</main>
	</body>
</html>
