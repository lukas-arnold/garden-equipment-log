{{define "template"}}
<h1 class="center">{{T "editOperation"}}</h1>
<form action="/device-operation/save/{{.Operation.Id}}" method="POST">
	<label for="startTime">{{T "startTime"}}</label>
	<input type="datetime-local" id="startTime" name="startTime" value="{{.Operation.StartTime}}" required>
	<label for="endTime">{{T "endTime"}}</label>
	<input type="datetime-local" id="endTime" name="endTime" value="{{.Operation.EndTime}}" required>
	<label for="note">{{T "note"}}</label>
	<input type="text" id="note" name="note" value="{{.Operation.Note}}" placeholder='{{T "note"}}'>
	<input type="submit" value='{{T "save"}}' />
</form>
{{end}}
