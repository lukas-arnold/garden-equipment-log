name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"


jobs:
  test:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build application
        run: go build ./...


  release:
    name: Build and publish release image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build, push, and release
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lukas-arnold/garden-equipment-log:latest
            ghcr.io/lukas-arnold/garden-equipment-log:${{ github.sha }}
            ghcr.io/lukas-arnold/garden-equipment-log:${{ github.ref_name }}